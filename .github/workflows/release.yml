name: Release Foundry module

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test
        run: node --test
      - name: Package versioned module
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./tools/build-release.ps1 -Tag $env:RELEASE_TAG
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create $env:RELEASE_TAG
          dist/module.json dist/lancer-npc-pilot.zip
          --verify-tag --generate-notes --latest
          --title "Lancer NPC Pilot $env:RELEASE_TAG"
